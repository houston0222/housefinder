services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: housefinder-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: housefinder-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: pgvector/pgvector:pg16
    container_name: housefinder-db
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: housefinder-pipeline
    volumes:
      - ./backend:/app
      - ./pipeline:/pipeline
      - ./backend/data/pipeline:/app/data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/pipeline
    depends_on:
      - db
    profiles:
      - pipeline

volumes:
  postgres_data: