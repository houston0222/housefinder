services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: housefinder-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: housefinder-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app